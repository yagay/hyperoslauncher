name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify LSPosed 7869 HYOS entry contract
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"

          for F in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/native_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list \
            lib/arm64-v8a/libdesktopgridx_hyos.so \
            lib/arm64-v8a/libdesktopgridx.so; do
            unzip -l "$APK" | grep -F "$F"
          done

          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fx 'com.yagay.desktopgridx.HookEntry'
          test "$(unzip -p "$APK" META-INF/xposed/native_init.list)" = 'libdesktopgridx_hyos.so'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'minApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'staticScope=true'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.miui.home'

          if unzip -l "$APK" | grep -Fq 'assets/native_init'; then
            echo 'legacy assets/native_init must not be packaged' >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Fq 'assets/xposed_init'; then
            echo 'legacy assets/xposed_init must not be packaged' >&2
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libdesktopgridx_hyos.so > /tmp/libdesktopgridx_hyos.so
          readelf -Ws /tmp/libdesktopgridx_hyos.so | grep -E 'GLOBAL.*DEFAULT.*native_init$'
          test "$(readelf -Ws /tmp/libdesktopgridx_hyos.so | awk '$5=="GLOBAL" && $6=="DEFAULT" && $8!="" {print $8}' | grep -v '^native_init$' | wc -l)" -eq 0

          echo '=== HYOS DT_NEEDED ==='
          readelf -d /tmp/libdesktopgridx_hyos.so | grep NEEDED || true
          if readelf -d /tmp/libdesktopgridx_hyos.so | grep -E 'libshadowhook|libc\+\+_shared'; then
            echo 'HYOS entry must be self-contained and not depend on ShadowHook/libc++_shared' >&2
            exit 1
          fi

          echo '=== HYOS LOAD alignment ==='
          readelf -l /tmp/libdesktopgridx_hyos.so | grep LOAD
          python3 - "$APK" <<'PY'
          import sys, zipfile, subprocess, re
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              info=z.getinfo('lib/arm64-v8a/libdesktopgridx_hyos.so')
              print('libdesktopgridx_hyos.so compress_type=', info.compress_type)
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('HYOS entry is not ZIP_STORED/direct-map compatible')
              if 'assets/native_init' in names or 'assets/xposed_init' in names:
                  raise SystemExit('legacy Xposed entry unexpectedly packaged')
          out=subprocess.check_output(['readelf','-l','/tmp/libdesktopgridx_hyos.so'], text=True)
          aligns=[]
          for line in out.splitlines():
              if line.lstrip().startswith('LOAD'):
                  parts=line.split()
                  if parts:
                      try: aligns.append(int(parts[-1],16))
                      except ValueError: pass
          if not aligns or min(aligns) < 0x4000:
              raise SystemExit(f'HYOS LOAD segment alignment is not 16KiB: {aligns}')
          print('LSPosed 7869 HYOS entry verification passed.')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGridX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
