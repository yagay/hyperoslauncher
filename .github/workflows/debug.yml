name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify LSPosed 7869 HYOS STL-free contract
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"

          for F in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/native_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list \
            lib/arm64-v8a/libdesktopgridx_hyos.so \
            lib/arm64-v8a/libdesktopgridx.so; do
            unzip -l "$APK" | grep -F "$F"
          done

          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fx 'com.yagay.desktopgridx.HookEntry'
          test "$(unzip -p "$APK" META-INF/xposed/native_init.list)" = 'libdesktopgridx_hyos.so'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'minApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'staticScope=true'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.miui.home'

          if unzip -l "$APK" | grep -Eq 'assets/xposed_init|assets/native_init'; then
            echo 'legacy Xposed compatibility entries must not be packaged' >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Eq 'lib/arm64-v8a/libshadowhook.so|lib/arm64-v8a/libdesktopgridx_minprobe.so|libc\+\+_shared.so'; then
            echo 'obsolete or C++ runtime library unexpectedly packaged' >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Eq 'io/github/libxposed/api|de/robv/android/xposed'; then
            echo 'Xposed framework API classes were packaged into the module APK' >&2
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libdesktopgridx_hyos.so > /tmp/hyos.so
          unzip -p "$APK" lib/arm64-v8a/libdesktopgridx.so > /tmp/analyzer.so

          EXPORTS=$(readelf --dyn-syms -W /tmp/hyos.so | awk '$5=="GLOBAL" && $6=="DEFAULT" && $7!="UND" {print $8}' | sort -u)
          test "$EXPORTS" = 'native_init'
          readelf --dyn-syms -W /tmp/hyos.so | grep -E '[[:space:]]native_init$'
          if readelf --dyn-syms -W /tmp/hyos.so | grep -E 'native_init@'; then
            echo 'native_init must be unversioned' >&2
            exit 1
          fi

          readelf -SW /tmp/hyos.so | grep -F '.init_array'
          strings /tmp/hyos.so | grep -F 'DGX_HYOS_CTOR pid='
          strings /tmp/hyos.so | grep -F 'DGX_NATIVE_ENTRY api='

          for SO in /tmp/hyos.so /tmp/analyzer.so; do
            if readelf -d "$SO" | grep -E 'libc\+\+|libstdc\+\+'; then
              echo "$SO unexpectedly depends on a C++ runtime" >&2
              exit 1
            fi
          done
          if readelf -d /tmp/hyos.so | grep -E 'libshadowhook'; then
            echo 'HYOS entry has forbidden ShadowHook dependency' >&2
            exit 1
          fi

          python3 - "$APK" <<'PY'
          import subprocess, sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              info=z.getinfo('lib/arm64-v8a/libdesktopgridx_hyos.so')
              print('hyos compress_type=', info.compress_type)
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('HYOS entry must be ZIP_STORED for direct mapping')
          out=subprocess.check_output(['readelf','-lW','/tmp/hyos.so'],text=True)
          aligns=[]
          for line in out.splitlines():
              if line.lstrip().startswith('LOAD'):
                  try: aligns.append(int(line.split()[-1],16))
                  except ValueError: pass
          print('LOAD aligns=',aligns)
          if not aligns or min(aligns)<0x4000:
              raise SystemExit('HYOS LOAD alignment is below 16 KiB')
          print('LSPosed 7869 HYOS STL-free API102 packaging verification passed.')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGridX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
