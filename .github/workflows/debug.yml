name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify LSPosed 7869 Modern + HYOS contract
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"

          for F in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/native_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list \
            lib/arm64-v8a/libdesktopgridx_hyos.so \
            lib/arm64-v8a/libdesktopgridx.so; do
            unzip -l "$APK" | grep -F "$F"
          done

          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fx 'com.yagay.desktopgridx.HookEntry'
          test "$(unzip -p "$APK" META-INF/xposed/native_init.list)" = 'libdesktopgridx_hyos.so'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'minApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'staticScope=true'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.miui.home'

          for OLD in assets/native_init assets/xposed_init lib/arm64-v8a/libshadowhook.so lib/arm64-v8a/libdesktopgridx_minprobe.so; do
            if unzip -l "$APK" | grep -Fq "$OLD"; then
              echo "obsolete entry unexpectedly packaged: $OLD" >&2
              exit 1
            fi
          done

          # API classes must stay compileOnly and must not be bundled into the APK.
          if unzip -l "$APK" | grep -Eq 'io/github/libxposed/api|XposedModule.class'; then
            echo 'libxposed API classes were packaged into the module APK' >&2
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libdesktopgridx_hyos.so > /tmp/hyos.so
          echo '=== dynamic exports ==='
          readelf --dyn-syms -W /tmp/hyos.so
          EXPORTS=$(readelf --dyn-syms -W /tmp/hyos.so | awk '$5=="GLOBAL" && $6=="DEFAULT" && $7!="UND" {n=$8; sub(/@@.*/,"",n); if(n!="") print n}' | sort -u)
          test "$EXPORTS" = 'native_init'

          echo '=== DT_NEEDED ==='
          readelf -d /tmp/hyos.so | grep NEEDED || true
          if readelf -d /tmp/hyos.so | grep -E 'libshadowhook|libc\+\+_shared'; then
            echo 'HYOS entry has forbidden runtime dependency' >&2
            exit 1
          fi

          python3 - "$APK" <<'PY'
          import subprocess, sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              info=z.getinfo('lib/arm64-v8a/libdesktopgridx_hyos.so')
              print('hyos compress_type=', info.compress_type)
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('HYOS entry must be ZIP_STORED for direct mapping')
          out=subprocess.check_output(['readelf','-lW','/tmp/hyos.so'],text=True)
          aligns=[]
          for line in out.splitlines():
              if line.lstrip().startswith('LOAD'):
                  try: aligns.append(int(line.split()[-1],16))
                  except ValueError: pass
          print('LOAD aligns=',aligns)
          if not aligns or min(aligns)<0x4000:
              raise SystemExit('HYOS LOAD alignment is below 16 KiB')
          print('LSPosed 7869 Modern registration + HYOS native verification passed.')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGridX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
