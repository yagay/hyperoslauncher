name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify LSPosed API 102 / HYOS packaging
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          for F in \
            META-INF/xposed/java_init.list \
            META-INF/xposed/native_init.list \
            META-INF/xposed/module.prop \
            META-INF/xposed/scope.list \
            assets/native_init \
            lib/arm64-v8a/libdesktopgridx_minprobe.so \
            lib/arm64-v8a/libdesktopgridx.so; do
            unzip -l "$APK" | grep -F "$F"
          done

          # Modern API 102 contract must stay internally consistent.
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fx 'com.yagay.desktopgridx.HookEntry'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'minApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'staticScope=true'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fx 'com.miui.home'

          # Do not mix a legacy Java module into a Modern API 102 APK.
          if unzip -l "$APK" | grep -Fq 'assets/xposed_init'; then
            echo 'assets/xposed_init must not be present in the API 102 build' >&2
            exit 1
          fi
          if unzip -l "$APK" | grep -Fq 'LegacyHookEntry'; then
            echo 'LegacyHookEntry must not be packaged' >&2
            exit 1
          fi

          # Keep both native A/B probes while diagnosing the 7869 HYOS dispatcher.
          for SO in libdesktopgridx_minprobe.so libdesktopgridx.so; do
            unzip -p "$APK" META-INF/xposed/native_init.list | grep -Fx "$SO"
            unzip -p "$APK" assets/native_init | grep -Fx "$SO"
            unzip -p "$APK" "lib/arm64-v8a/$SO" > "/tmp/$SO"
            readelf -Ws "/tmp/$SO" | grep -E 'GLOBAL.*DEFAULT.*native_init$'
          done

          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          required=(
              'META-INF/xposed/java_init.list',
              'META-INF/xposed/native_init.list',
              'META-INF/xposed/module.prop',
              'META-INF/xposed/scope.list',
              'assets/native_init',
              'lib/arm64-v8a/libdesktopgridx_minprobe.so',
              'lib/arm64-v8a/libdesktopgridx.so',
          )
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              if 'assets/xposed_init' in names:
                  raise SystemExit('legacy Java entry unexpectedly packaged')
              for name in required:
                  data=z.read(name)
                  if not data:
                      raise SystemExit(f'{name} is empty')
              prop=z.read('META-INF/xposed/module.prop').decode('utf-8')
              if 'minApiVersion=102' not in prop or 'targetApiVersion=102' not in prop:
                  raise SystemExit('module.prop does not declare API 102 consistently')
              for name in ('lib/arm64-v8a/libdesktopgridx_minprobe.so','lib/arm64-v8a/libdesktopgridx.so'):
                  info=z.getinfo(name)
                  print(name, 'compress_type=', info.compress_type)
                  if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                      raise SystemExit(f'unexpected native library compression type: {info.compress_type}')
          print('LSPosed 7869 API 102 packaging verification passed.')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGridX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
